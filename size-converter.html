<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Size Converter | Inch & CM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f0f4f8; color: #333; padding-top: 70px; }
        nav { background-color: #3498db; padding: 15px; position: fixed; top: 0; left: 0; width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 100; }
        nav a { color: white; margin: 0 10px; text-decoration: none; font-weight: bold; }
        nav a:hover { color: #ecf0f1; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; }
        button:hover { background-color: #2980b9; }
        .result { margin-top: 30px; padding: 20px; background-color: #e8f4fd; border-radius: 5px; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #3498db; text-decoration: none; }
        footer { text-align: center; margin-top: 30px; color: #777; font-size: 0.9rem; padding: 20px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="profit-calculator.html">💰 Profit</a>
        <a href="vat-calculator.html">💶 VAT</a>
        <a href="shipping-estimator.html">🚚 Shipping</a>
        <a href="forbidden-word-checker.html">🚫 Compliance</a>
        <a href="currency-converter.html">💱 Currency</a>
        <a href="size-converter.html">📏 Size</a>
        <a href="title-generator.html">📝 Titles</a>
        <a href="description-generator.html">🌐 Desc</a>
        <a href="package-tracker.html">📦 Tracking</a>
    </nav>

    <div class="container">
        <h1>Size Unit Converter</h1>
        <form id="sizeForm">
            <div class="form-group">
                <label for="num">Value</label>
                <input type="number" id="num" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="unit">Convert Type</label>
                <select id="unit" required>
                    <option value="cm2inch">CM → Inch</option>
                    <option value="inch2cm">Inch → CM</option>
                </select>
            </div>
            <button type="submit">Convert</button>
        </form>

        <div class="result" id="result" style="display: none;">
            <p><strong>Result:</strong> <span id="sizeRes"></span></p>
        </div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <footer>
        <p>© 2025 Etsy Seller Toolkit | All tools are free to use.</p>
    </footer>

    <script>
        document.getElementById('sizeForm').addEventListener('submit',function(e){
            e.preventDefault();
            let n = parseFloat(document.getElementById('num').value);
            let t = document.getElementById('unit').value;
            let res;
            if(t === "cm2inch"){
                res = (n / 2.54).toFixed(2) + " Inch";
            }else{
                res = (n * 2.54).toFixed(2) + " CM";
            }
            document.getElementById('sizeRes').innerText = res;
            document.getElementById('result').style.display = 'block';
        });
    </script>
</body>
</html>
