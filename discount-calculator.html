<body>
    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="profit-calculator.html">💰 Profit</a>
        <a href="vat-calculator.html">💶 VAT</a>
        <a href="shipping-estimator.html">🚚 Shipping</a>
        <a href="forbidden-word-checker.html">🚫 Forbidden Words</a>
        <a href="currency-converter.html">💱 Currency</a>
        <a href="size-converter.html">📏 Size</a>
        <a href="keyword-expander.html">🔑 Keyword</a>
        <a href="char-counter.html">🔤 Char Counter</a>
        <a href="stock-calculator.html">📦 Stock</a>

        <a href="profit-rate.html">📈 Profit Rate</a>
        <a href="text-cleaner.html">🧹 Text Clean</a>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Discount Calculator</h1>
            <p>Calculate price after discount</p>
        </div>
        <div class="calculator-card">
            <div class="input-group">
                <label>Original Price</label>
                <input type="number" id="oriPrice" placeholder="Enter original price">
            </div>
            <div class="input-group">
                <label>Discount (%)</label>
                <input type="number" id="disRate" placeholder="Enter discount">
            </div>
            <div class="btn-group">
                <button class="btn" onclick="calc()">Calculate</button>
                <button class="btn btn-secondary" onclick="reset()">Reset</button>
            </div>
            <div class="result-box" id="res"></div>
        </div>
        <div class="back-to-home">
            <a href="index.html" class="btn">Back Home</a>
        </div>
    </div>

    <script>
        function calc(){
            let p = parseFloat(document.getElementById('oriPrice').value)||0;
            let r = parseFloat(document.getElementById('disRate').value)||0;
            let final = p * (1 - r / 100);
            document.getElementById('res').innerText = `Final Price: $${final.toFixed(2)}`;
        }
        function reset(){
            document.getElementById('oriPrice').value = "";
            document.getElementById('disRate').value = "";
            document.getElementById('res').innerText = "";
        }
    </script>
</body>
</html>
