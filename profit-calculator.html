<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etsy Profit Calculator | Calculate Your Selling Profit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f0f4f8; color: #333; padding-top: 70px; }
        nav { background-color: #3498db; padding: 15px; position: fixed; top: 0; left: 0; width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 100; }
        nav a { color: white; margin: 0 10px; text-decoration: none; font-weight: bold; }
        nav a:hover { color: #ecf0f1; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; }
        button:hover { background-color: #2980b9; }
        .result { margin-top: 30px; padding: 20px; background-color: #e8f4fd; border-radius: 5px; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #3498db; text-decoration: none; }
        footer { text-align: center; margin-top: 30px; color: #777; font-size: 0.9rem; padding: 20px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="profit-calculator.html">💰 Profit Calculator</a>
        <a href="title-generator.html">📝 Title & Tags</a>
        <a href="description-generator.html">🌐 Description</a>
        <a href="package-tracker.html">📦 Package Tracker</a>
    </nav>

    <div class="container">
        <h1>Etsy Profit Calculator</h1>
        <form id="profitForm">
            <div class="form-group">
                <label for="price">Selling Price ($)</label>
                <input type="number" id="price" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="cost">Product Cost ($)</label>
                <input type="number" id="cost" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="shipping">Shipping Cost ($)</label>
                <input type="number" id="shipping" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="fees">Other Fees ($)</label>
                <input type="number" id="fees" step="0.01" required>
            </div>
            <button type="submit">Calculate Profit</button>
        </form>

        <div class="result" id="result" style="display: none;">
            <p><strong>Total Cost:</strong> $<span id="totalCost"></span></p>
            <p><strong>Net Profit:</strong> $<span id="netProfit"></span></p>
            <p><strong>Profit Margin:</strong> <span id="profitMargin"></span>%</p>
        </div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <footer>
        <p>© 2025 Etsy Seller Toolkit | All tools are free to use.</p>
    </footer>

    <script>
        document.getElementById('profitForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const price = parseFloat(document.getElementById('price').value);
            const cost = parseFloat(document.getElementById('cost').value);
            const shipping = parseFloat(document.getElementById('shipping').value);
            const fees = parseFloat(document.getElementById('fees').value);

            const etsyFee = price * 0.065;
            const transactionFee = 0.25;

            const totalCost = cost + shipping + fees + etsyFee + transactionFee;
            const netProfit = price - totalCost;
            const profitMargin = ((price - totalCost) / price * 100).toFixed(2);

            document.getElementById('totalCost').textContent = totalCost.toFixed(2);
            document.getElementById('netProfit').textContent = netProfit.toFixed(2);
            document.getElementById('profitMargin').textContent = profitMargin;
            document.getElementById('result').style.display = 'block';
        });
    </script>
</body>
</html>
