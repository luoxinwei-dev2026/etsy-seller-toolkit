<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title & Tag Generator | Optimize Your Etsy Listings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f0f4f8; color: #333; padding-top: 70px; }
        nav { background-color: #3498db; padding: 15px; position: fixed; top: 0; left: 0; width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 100; }
        nav a { color: white; margin: 0 10px; text-decoration: none; font-weight: bold; }
        nav a:hover { color: #ecf0f1; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; }
        button:hover { background-color: #2980b9; }
        .result { margin-top: 30px; padding: 20px; background-color: #e8f4fd; border-radius: 5px; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #3498db; text-decoration: none; }
        footer { text-align: center; margin-top: 30px; color: #777; font-size: 0.9rem; padding: 20px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="profit-calculator.html">💰 Profit Calculator</a>
        <a href="title-generator.html">📝 Title & Tags</a>
        <a href="description-generator.html">🌐 Description</a>
        <a href="package-tracker.html">📦 Package Tracker</a>
    </nav>

    <div class="container">
        <h1>Title & Tag Generator</h1>
        <form id="titleForm">
            <div class="form-group">
                <label for="product">Product Name</label>
                <input type="text" id="product" required>
            </div>
            <div class="form-group">
                <label for="niche">Niche/Category</label>
                <input type="text" id="niche" required>
            </div>
            <button type="submit">Generate Titles & Tags</button>
        </form>

        <div class="result" id="result" style="display: none;">
            <h3>Suggested Titles:</h3>
            <ul id="titleList"></ul>
            <h3 style="margin-top: 20px;">Suggested Tags:</h3>
            <ul id="tagList"></ul>
        </div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <footer>
        <p>© 2025 Etsy Seller Toolkit | All tools are free to use.</p>
    </footer>

    <script>
        document.getElementById('titleForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const product = document.getElementById('product').value;
            const niche = document.getElementById('niche').value;

            const titles = [
                `Handmade ${product} - Unique ${niche} Gift`,
                `Custom ${product} for ${niche} Lovers`,
                `Minimalist ${product} - Perfect ${niche} Decor`
            ];
            const tags = [
                product, niche, `handmade${niche}`, `custom${product}`, `unique${niche}`
            ];

            document.getElementById('titleList').innerHTML = titles.map(t => `<li>${t}</li>`).join('');
            document.getElementById('tagList').innerHTML = tags.map(t => `<li>${t}</li>`).join('');
            document.getElementById('result').style.display = 'block';
        });
    </script>
</body>
</html>
