<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profit Rate</title>
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <div class="global-buttons">
        <button class="global-btn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </div>

    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="profit-calculator.html">💰 Profit</a>
        <a href="vat-calculator.html">💶 VAT</a>
        <a href="shipping-estimator.html">🚚 Shipping</a>
        <a href="forbidden-word-checker.html">🚫 Forbidden Words</a>
        <a href="currency-converter.html">💱 Currency</a>
        <a href="size-converter.html">📏 Size</a>
        <a href="keyword-expander.html">🔑 Keyword</a>
        <a href="char-counter.html">🔤 Char Counter</a>
        <a href="stock-calculator.html">📦 Stock</a>
        <a href="volume-weight.html">📐 Vol Weight</a>
        <a href="quote-calculator.html">💵 Quote Margin</a>
        <a href="title-generator.html">📝 Title</a>
        <a href="description-generator.html">📄 Description</a>
        <a href="package-tracker.html">📦 Tracking</a>
        <a href="discount-calculator.html">💴 Discount</a>
        <a href="unit-converter.html">⚖️ Unit Convert</a>
        <a href="time-calculator.html">⏰ Time Calc</a>
        <a href="profit-rate.html">📈 Profit Rate</a>
        <a href="text-cleaner.html">🧹 Text Clean</a>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Profit Rate Calculator</h1>
            <p>Calculate profit percentage</p>
        </div>
        <div class="calculator-card">
            <div class="input-group">
                <label>Total Revenue ($)</label>
                <input type="number" id="revenue" placeholder="Enter revenue">
            </div>
            <div class="input-group">
                <label>Total Cost ($)</label>
                <input type="number" id="cost" placeholder="Enter cost">
            </div>
            <div class="btn-group">
                <button class="btn" onclick="calc()">Calculate</button>
                <button class="btn btn-secondary" onclick="reset()">Reset</button>
            </div>
            <div class="result-box" id="res"></div>
        </div>
        <div class="back-to-home">
            <a href="index.html" class="btn">Back Home</a>
        </div>
    </div>

    <script>
        function toggleDarkMode(){
            document.body.classList.toggle("dark-mode");
        }
        function calc(){
            let rev = parseFloat(document.getElementById('revenue').value)||0;
            let cost = parseFloat(document.getElementById('cost').value)||0;
            let rate = rev === 0 ? 0 : ((rev - cost) / rev * 100);
            document.getElementById('res').innerText = "Profit Rate: " + rate.toFixed(2) + "%";
        }
        function reset(){
            document.getElementById('revenue').value = "";
            document.getElementById('cost').value = "";
            document.getElementById('res').innerText = "";
        }
    </script>
</body>
</html>
