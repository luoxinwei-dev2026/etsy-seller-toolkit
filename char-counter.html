    <div class="container">
        <div class="page-header">
            <h1>Character Counter</h1>
            <p>Count text characters</p>
        </div>
        <div class="calculator-card">
            <div class="input-group">
                <label>Input Text</label>
                <textarea id="text" rows="5" placeholder="Paste text here"></textarea>
            </div>
            <div class="btn-group">
                <button class="btn" onclick="count()">Count</button>
                <button class="btn btn-secondary" onclick="reset()">Reset</button>
            </div>
            <div class="result-box" id="res"></div>
        </div>
        <div class="back-to-home">
            <a href="index.html" class="btn">Back Home</a>
        </div>
    </div>

    <script>
        function toggleDarkMode(){
            document.body.classList.toggle("dark-mode");
        }
        function count(){
            let txt = document.getElementById('text').value;
            document.getElementById('res').innerText = "Total Characters: " + txt.length;
        }
        function reset(){
            document.getElementById('text').value = "";
            document.getElementById('res').innerText = "";
        }
    </script>
</body>
